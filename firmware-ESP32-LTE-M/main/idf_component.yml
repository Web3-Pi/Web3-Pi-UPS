# Pulled from the ESP Component Registry. Source on GitHub:
#   https://github.com/espressif/esp-protocols/tree/master/components/esp_modem
#
# The reviewed UART task affinity overlay checks pristine 1.4.2 source hashes.
# Review that overlay and its host tests before updating this exact dependency.
dependencies:
  espressif/esp_modem: "1.4.2"
  # esp-mqtt was moved out of the ESP-IDF tree into the component manager
  # in v6.0+. Same code, just a different home.
  # Exact 1.0.0 build inputs with the local resend/abort fix; see component provenance.
  espressif/mqtt:
    version: "1.0.0"
    override_path: "../components/espressif__mqtt"
  # cJSON for Arkiv JSON-RPC parsing (Track 2 / ADR-0011). The same
  # official Espressif-registry component the Arkiv PoC used.
  espressif/cjson: "^1"
  # WebSocket client for Arkiv `eth_subscribe(logs)` over WSS — replaces
  # the 5 s HTTP cmd-poll loop (Track 2 / ADR-0011 §4.4 transport
  # optimization; see ARKIV-data-usage.md sec. E for the ~1000× LTE-M
  # transfer reduction this enables).
  espressif/esp_websocket_client: "*"

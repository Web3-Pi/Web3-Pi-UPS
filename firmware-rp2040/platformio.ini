; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = pico

[common]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
; Core pinned to >=5.5.1: arduino-pico <=5.5.0 has a hand-rolled SerialUART
; RX ring that corrupts permanently when a burst hits the full boundary
; (field incident 2026-07-11, see arduino-pico-serialuart-rx-starvation-report.md
; in the mono-repo root). 5.5.1 replaced it with LocklessQueue. We pin 5.6.1.
platform_packages = framework-arduinopico @ https://github.com/earlephilhower/arduino-pico.git#5.6.1
; OTA-2 (RP2040 self-update via net.fw_xfer, src/fw_update.*): the OTA
; bootloader linked into every arduino-pico image applies a staged image
; from LittleFS at boot, so the fw_xfer receiver needs a filesystem large
; enough for the incoming image AND a rollback snapshot of the running one
; (~270 KB each today). Resulting 2 MB flash map:
;   0x10000000  app        1044 KB (incl. 12 KB boot2 + OTA stub + ptable)
;   0x100FF000  LittleFS   1024 KB (fw_xfer staging + rollback snapshot)
;   0x101FF000  EEPROM        4 KB (ui_settings — same sector as before)
; KEEP this size stable across releases: the running image's own partition
; table locates LittleFS, and the rollback snapshot + pending-verify marker
; must survive the NEW image mounting the filesystem at the same offset.
board_build.filesystem_size = 1m
monitor_speed = 115200
board_build.arduino.earlephilhower.usb_manufacturer = Web3_Pi
board_build.arduino.earlephilhower.usb_product = Web3_Pi_UPS
lib_deps =
	adafruit/Adafruit GFX Library@^1.12.3
	adafruit/Adafruit SSD1306@^2.5.15
	ricmoo/QRCode@^0.0.1

[env:pico]
extends = common
upload_protocol = picotool
;upload_port = /dev/cu.usbmodem3101

[env:pico_swd]
extends = common
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
debug_init_break = tbreak setup
